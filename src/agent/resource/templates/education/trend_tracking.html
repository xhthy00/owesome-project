<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --edu-primary: #1677ff; --edu-primary-bg: #e6f4ff;
      --edu-text-lv1: rgba(0,0,0,0.88); --edu-text-lv2: rgba(0,0,0,0.65); --edu-text-lv3: rgba(0,0,0,0.45);
      --edu-border: #f0f0f0; --edu-success: #52c41a; --edu-warning: #faad14; --edu-error: #ff4d4f;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--edu-text-lv1); }
    .edu-container { max-width: 1040px; margin: 24px auto; padding: 0 16px; }
    .edu-card { background: #fff; border: 1px solid var(--edu-border); border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    h3 { margin: 14px 0 8px; font-size: 15px; color: var(--edu-text-lv2); }
    p { margin: 6px 0; line-height: 1.7; }
    .edu-sub { color: var(--edu-text-lv3); font-size: 13px; }
    .edu-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .edu-table th, .edu-table td { border: 1px solid var(--edu-border); padding: 8px 10px; text-align: left; }
    .edu-table th { background: var(--edu-primary-bg); color: var(--edu-text-lv2); font-weight: 600; }
    .edu-table tr:nth-child(even) td { background: #fafafa; }
    .edu-chart { width: 100%; height: 360px; }
    .edu-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--edu-primary-bg); color: var(--edu-primary); }
    .edu-warn { color: var(--edu-warning); font-weight: 600; }
    .edu-up { color: var(--edu-success); font-weight: 600; }
    .edu-down { color: var(--edu-error); font-weight: 600; }
    .edu-footer { color: var(--edu-text-lv3); font-size: 12px; text-align: right; }
    @media print { body { background: #fff; } .edu-card { border: none; } }
  </style>
</head>
<body>
  <div class="edu-container">
    <section class="edu-card">
      <h1>{{REPORT_TITLE}}</h1>
      <p class="edu-sub">{{REPORT_SUBTITLE}}</p>
      <p class="edu-sub">
        <span class="edu-badge">{{REPORT_TYPE}}</span>
        <span class="edu-badge">{{TARGET_NAME}}</span>
        <span class="edu-badge">{{SUBJECT_NAME}}</span>
        {{REPORT_TIME}}
      </p>
    </section>

    <section class="edu-card">
      <h2>历次成绩趋势</h2>
      <div id="trendChart" class="edu-chart"></div>
      <script type="application/json" id="trendChartData">{{TREND_CHART}}</script>
      <script>
        (function () {
          var el = document.getElementById('trendChart');
          var raw = (document.getElementById('trendChartData').textContent || '').trim();
          if (!raw || raw === '{}' || raw === 'null') {
            if (el) el.innerHTML = '<p class="edu-sub" style="padding:48px 0;text-align:center">暂无趋势图数据</p>';
            return;
          }
          function draw() {
            if (typeof echarts === 'undefined') {
              if (el) el.innerHTML = '<p class="edu-sub" style="padding:48px 0;text-align:center">图表库加载失败，请查看下方明细表</p>';
              return;
            }
            try { echarts.init(el).setOption(JSON.parse(raw)); } catch (e) {
              if (el) el.innerHTML = '<p class="edu-sub" style="padding:48px 0;text-align:center">趋势图解析失败</p>';
            }
          }
          if (typeof echarts !== 'undefined') { draw(); }
          else { setTimeout(draw, 400); }
        })();
      </script>
    </section>

    <section class="edu-card">
      <h2>历次成绩明细</h2>
      <div>{{TREND_TABLE}}</div>
    </section>

    <section class="edu-card">
      <h2>变化分析</h2>
      <div>{{CHANGE_INFO}}</div>
    </section>

    <section class="edu-card">
      <h2>总体分析</h2>
      <div>{{SUMMARY}}</div>
    </section>

    <section class="edu-card">
      <h2>改进建议</h2>
      <div>{{RECOMMENDATIONS}}</div>
    </section>

    <div class="edu-footer">Generated by awesome-project · 教育学情分析</div>
  </div>
</body>
</html>
