<!--
  教育学情报告公共基底（Phase 1：正则占位符模式，无 Jinja 继承）。

  本文件是「样式与脚本规范」的单一来源；各报告模板（class_overview /
  grade_comparison / subject_diagnosis）在 Phase 1 阶段各自内联一份精简版
  <style> + ECharts 加载脚本。Phase 3 引入 Jinja2 后，本文件将改为
  {% block %} 基模板，报告模板用 {% extends "education/_base.html" %} 复用。

  设计约定：
  - 字体 / 间距 / 主色对齐 frontend-react/styles/gov-theme.css：
    主色 #1677ff，正文 rgba(0,0,0,0.88)，次级 rgba(0,0,0,0.65)。
  - 图表统一用 ECharts CDN（5.x），由各模板的 <script> 调用
    echarts.init(el).setOption(JSON.parse(占位符JSON))。
  - 占位符统一 {{KEY}}（仅 [A-Za-z0-9_]），由 render_html_report 正则替换。
  - 打印友好：@media print 隐藏工具条、强制黑白。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --edu-primary: #1677ff;
      --edu-primary-bg: #e6f4ff;
      --edu-text-lv1: rgba(0,0,0,0.88);
      --edu-text-lv2: rgba(0,0,0,0.65);
      --edu-text-lv3: rgba(0,0,0,0.45);
      --edu-border: #f0f0f0;
      --edu-success: #52c41a;
      --edu-warning: #faad14;
      --edu-error: #ff4d4f;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--edu-text-lv1); }
    .edu-container { max-width: 1040px; margin: 24px auto; padding: 0 16px; }
    .edu-card { background: #fff; border: 1px solid var(--edu-border); border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; color: var(--edu-text-lv1); }
    h3 { margin: 14px 0 8px; font-size: 15px; color: var(--edu-text-lv2); }
    p { margin: 6px 0; line-height: 1.7; }
    .edu-sub { color: var(--edu-text-lv3); font-size: 13px; }
    .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .edu-kpi { border: 1px solid var(--edu-border); border-radius: 8px; padding: 12px 14px; background: #fafafa; }
    .edu-kpi .label { font-size: 12px; color: var(--edu-text-lv3); }
    .edu-kpi .value { margin-top: 4px; font-size: 20px; font-weight: 600; color: var(--edu-primary); }
    .edu-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .edu-table th, .edu-table td { border: 1px solid var(--edu-border); padding: 8px 10px; text-align: left; }
    .edu-table th { background: var(--edu-primary-bg); color: var(--edu-text-lv2); font-weight: 600; }
    .edu-chart { width: 100%; height: 320px; }
    .edu-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--edu-primary-bg); color: var(--edu-primary); }
    .edu-warn { color: var(--edu-warning); font-weight: 600; }
    .edu-error { color: var(--edu-error); font-weight: 600; }
    .edu-success { color: var(--edu-success); font-weight: 600; }
    .edu-footer { color: var(--edu-text-lv3); font-size: 12px; text-align: right; }
    @media print { .edu-toolbar { display: none; } body { background: #fff; } .edu-card { border: none; } }
  </style>
</head>
<body>
  <div class="edu-container">
    <!-- 各报告模板从这里开始替换主体内容 -->
    <section class="edu-card">
      <h1>{{REPORT_TITLE}}</h1>
      <p class="edu-sub">{{REPORT_SUBTITLE}}</p>
      <p class="edu-sub">{{REPORT_TIME}}</p>
    </section>
    <!-- 主体由具体报告模板提供 -->
  </div>
</body>
</html>
