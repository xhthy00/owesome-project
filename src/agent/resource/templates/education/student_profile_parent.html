<!--
  学生个体报告 · 家长版（简化叙事）。
  与 student_profile.html 同数据契约，但弱化排名术语、突出薄弱项与可行动建议，
  供家长快速理解孩子学情。受众由 select_report_template(audience=parent) 选择。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --edu-primary: #1677ff; --edu-primary-bg: #e6f4ff;
      --edu-text-lv1: rgba(0,0,0,0.88); --edu-text-lv2: rgba(0,0,0,0.65); --edu-text-lv3: rgba(0,0,0,0.45);
      --edu-border: #f0f0f0; --edu-success: #52c41a; --edu-warning: #faad14; --edu-error: #ff4d4f;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--edu-text-lv1); }
    .edu-container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .edu-card { background: #fff; border: 1px solid var(--edu-border); border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { margin: 8px 0; line-height: 1.8; font-size: 15px; }
    .edu-sub { color: var(--edu-text-lv3); font-size: 13px; }
    .edu-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .edu-table th, .edu-table td { border: 1px solid var(--edu-border); padding: 10px; text-align: left; }
    .edu-table th { background: var(--edu-primary-bg); color: var(--edu-text-lv2); font-weight: 600; }
    .edu-chart { width: 100%; height: 300px; }
    .edu-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--edu-primary-bg); color: var(--edu-primary); }
    .edu-tip { border-left: 3px solid var(--edu-primary); background: var(--edu-primary-bg); padding: 12px 16px; border-radius: 4px; }
    .edu-footer { color: var(--edu-text-lv3); font-size: 12px; text-align: right; }
    @media print { body { background: #fff; } .edu-card { border: none; } }
  </style>
</head>
<body>
  <div class="edu-container">
    <section class="edu-card">
      <h1>{{STUDENT_NAME}} 的学情报告</h1>
      <p class="edu-sub">
        <span class="edu-badge">{{CLASS_NAME}}</span>
        <span class="edu-badge">{{EXAM_NAME}}</span>
        {{REPORT_TIME}}
      </p>
    </section>

    <section class="edu-card">
      <h2>各科表现一览</h2>
      <p>下图展示孩子在各科目的得分情况，越靠外圈表示该科表现越好。</p>
      <div id="subjectRadar" class="edu-chart"></div>
      <script type="application/json" id="subjectRadarData">{{SUBJECT_RADAR_CHART}}</script>
      <script>
        (function () {
          var raw = (document.getElementById('subjectRadarData').textContent || '').trim();
          if (!raw) { return; }
          try { echarts.init(document.getElementById('subjectRadar')).setOption(JSON.parse(raw)); } catch (e) {}
        })();
      </script>
      <div style="margin-top:12px">{{SUBJECT_TABLE}}</div>
    </section>

    <section class="edu-card">
      <h2>成绩变化趋势</h2>
      <p>孩子近期成绩走势如下，可直观看出进退步情况。</p>
      <div id="trendLine" class="edu-chart"></div>
      <script type="application/json" id="trendLineData">{{TREND_LINE_CHART}}</script>
      <script>
        (function () {
          var raw = (document.getElementById('trendLineData').textContent || '').trim();
          if (!raw) { return; }
          try { echarts.init(document.getElementById('trendLine')).setOption(JSON.parse(raw)); } catch (e) {}
        })();
      </script>
    </section>

    <section class="edu-card">
      <h2>老师的话</h2>
      <div class="edu-tip">{{SUMMARY}}</div>
    </section>

    <section class="edu-card">
      <h2>家庭配合建议</h2>
      <div class="edu-tip">{{RECOMMENDATIONS}}</div>
    </section>

    <div class="edu-footer">Generated by awesome-project · 教育学情分析</div>
  </div>
</body>
</html>
