<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --edu-primary: #1677ff; --edu-primary-bg: #e6f4ff;
      --edu-text-lv1: rgba(0,0,0,0.88); --edu-text-lv2: rgba(0,0,0,0.65); --edu-text-lv3: rgba(0,0,0,0.45);
      --edu-border: #f0f0f0; --edu-success: #52c41a; --edu-error: #ff4d4f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--edu-text-lv1); line-height: 1.6; }
    .edu-container { max-width: 1080px; margin: 24px auto; padding: 0 16px 32px; }
    .edu-card { background: #fff; border: 1px solid var(--edu-border); border-radius: 10px; padding: 22px 26px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    h2 { margin: 0 0 14px; font-size: 17px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--edu-border); }
    h3 { margin: 16px 0 10px; font-size: 15px; font-weight: 600; color: var(--edu-text-lv2); }
    h4 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; }
    p { margin: 6px 0; }
    .edu-sub { color: var(--edu-text-lv3); font-size: 13px; margin-bottom: 12px; }
    .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .edu-kpi { border: 1px solid var(--edu-border); border-radius: 8px; padding: 12px 14px; }
    .edu-kpi .label { font-size: 12px; color: var(--edu-text-lv3); }
    .edu-kpi .value { margin-top: 6px; font-size: 20px; font-weight: 600; color: var(--edu-primary); font-variant-numeric: tabular-nums; }
    .edu-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; background: var(--edu-primary-bg); color: var(--edu-primary); margin-right: 6px; }
    .edu-footer { color: var(--edu-text-lv3); font-size: 12px; text-align: right; margin-top: 8px; }
    .edu-table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--edu-border); border-radius: 8px; }
    .edu-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
    .edu-table th, .edu-table td { border-bottom: 1px solid var(--edu-border); padding: 10px 14px; text-align: left; }
    .edu-table thead th { background: var(--edu-primary-bg); color: var(--edu-text-lv2); font-weight: 600; white-space: nowrap; }
    .edu-table tbody tr:nth-child(even) td { background: #fafafa; }
    .edu-table th.num, .edu-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .edu-insight-line { padding: 8px 12px; margin: 8px 0; background: #fafafa; border-left: 3px solid var(--edu-primary); }
    .edu-card ul { margin: 10px 0; padding-left: 22px; }
  </style>
</head>
<body data-edu-school-id="{{SCHOOL_IDS}}">
  <div class="edu-container">
    <section class="edu-card">
      <h1>{{REPORT_TITLE}}</h1>
      <p class="edu-sub">{{REPORT_SUBTITLE}}</p>
      <p class="edu-sub">
        <span class="edu-badge">{{REPORT_TYPE}}</span>
        <span class="edu-badge">{{SCOPE}}</span>
        <span class="edu-badge">{{EXAM_NAME}}</span>
        <span class="edu-badge">上场 {{PREV_EXAM_NAME}}</span>
        {{REPORT_TIME}}
      </p>
    </section>
    <section class="edu-card">
      <h2>范围</h2>
      {{KPI_GRID}}
      <div>{{SUMMARY}}</div>
    </section>
    {{SUBJECT_HTML}}
    <section class="edu-card">
      <h2>改进建议</h2>
      <div data-edu-section="recommendations">{{RECOMMENDATIONS}}</div>
    </section>
    <div class="edu-footer">Generated by awesome-project · 学科教研分析</div>
  </div>
</body>
</html>
