# ===== awesome-data 反代片段 =====
# 挂到你现成 Nginx（通常 copy 到 conf.d/ 并 include），或并入某个 server{}。
# 前提：宿主机 3001 已由 docker compose 映射（docker-compose.yml: ports: 3001:3001）。

server {
    listen 80;
    # server_name your.domain.or.ip;   # 按需替换为域名或留空走默认

    client_max_body_size 64m;

    # 关键：报告生成走 SSE/chat-stream，必须关缓冲，否则前端收不到流式
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }

    # /api/* 也走 Next（Next 内部再转给后端），保持同源、统一入口
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # 静态/健康检查直打 Next 即可（Next 的 _next 静态资源）
    location /_next/ {
        proxy_pass http://127.0.0.1:3001;
    }
}