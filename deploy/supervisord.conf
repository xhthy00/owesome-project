# supervisord 主配置
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# 后端：单 worker（config_store 进程内覆盖，多 worker 会令阈值配置 API 只命中单进程）
[program:backend]
command=uvicorn src.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

# 前端：next start（生产）监听 0.0.0.0:3001，容器内它代理 /api 到 127.0.0.1:8000
# 不用 package.json 的 "start"（写死 -p 3001 但未绑 0.0.0.0），这里显式带 -H
# 不用 npx（runtime 镜像只拷了 node 二进制，npx 的 npm 模块路径不全），直接调 node_modules/.bin/next
# supervisord 不走 shell、不解析软链，用绝对路径 + 显式 node 调 next 真实入口最稳。
[program:frontend]
command=node /app/frontend-react/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 3001
directory=/app/frontend-react
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",BACKEND_URL="http://127.0.0.1:8000/api",NEXT_PUBLIC_API_BASE_URL="/api"
