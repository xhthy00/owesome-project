# 新前端单独端口。加到现有 conf.d，不要替换 listen 38433 的 server。
# Nginx 在容器内时，root 用容器路径。宿主机 /data/docker/nginx/html/awesome/pro
# 对应这里的 /usr/share/nginx/html/awesome/pro。
# 后端容器已映射 127.0.0.1:8001->8000。访问 http://127.0.0.1:8002 。
server {
    listen 8002;
    server_name _;

    root /usr/share/nginx/html/awesome/pro;
    index index.html;

    server_tokens off;
    client_max_body_size 64m;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
